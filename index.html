    <!-- Open Graph - podgląd linku w komunikatorach -->
    <meta property="og:title" content="PlexiSystem - System Produkcji" />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('PlexiSystem SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('PlexiSystem SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
